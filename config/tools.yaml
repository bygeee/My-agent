tools:
  file:
    description: "Identify file type and basic metadata for local challenge artifacts."
    command: ["file"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 20
    max_args: 4
    max_arg_length: 260
    output_limit: 12000
  strings:
    description: "Extract printable strings from local binaries or forensic artifacts."
    command: ["strings"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 20
    max_args: 6
    max_arg_length: 260
    output_limit: 20000
  readelf:
    description: "Inspect ELF headers, sections, symbols, and dynamic metadata."
    command: ["readelf", "-a"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 20
    max_args: 4
    max_arg_length: 260
    output_limit: 20000
  objdump:
    description: "Disassemble local binary code for reverse-engineering triage."
    command: ["objdump", "-d"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 30
    max_args: 4
    max_arg_length: 260
    output_limit: 20000
  exiftool:
    description: "Extract metadata from images, documents, and media artifacts."
    command: ["exiftool"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 20
    max_args: 4
    max_arg_length: 260
    output_limit: 16000
  binwalk:
    description: "Scan firmware or binary blobs for embedded files and signatures."
    command: ["binwalk"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 60
    max_args: 4
    max_arg_length: 260
    output_limit: 20000
  tshark_summary:
    description: "Read a packet capture and emit tshark summary output."
    command: ["tshark", "-r"]
    risk: low
    permissions: ["process:spawn", "filesystem:read"]
    requires_scope: false
    timeout: 60
    max_args: 4
    max_arg_length: 260
    output_limit: 20000
  http_get_safe:
    description: "Fetch an explicitly scoped HTTP/HTTPS URL and return status, headers, and clipped body content. Use this first for web CTF pages and static resources."
    command: ["builtin:http_get"]
    risk: medium
    permissions: ["network:targeted"]
    requires_scope: true
    timeout: 30
    max_args: 1
    max_arg_length: 1000
    output_limit: 30000
  http_head_safe:
    description: "Send an explicitly scoped HTTP/HTTPS HEAD request and return status and headers."
    command: ["builtin:http_head"]
    risk: medium
    permissions: ["network:targeted"]
    requires_scope: true
    timeout: 20
    max_args: 1
    max_arg_length: 1000
    output_limit: 12000
  whatweb_safe:
    description: "Fingerprint an explicitly scoped local or authorized web target."
    command: ["whatweb", "--no-errors"]
    risk: medium
    permissions: ["process:spawn", "network:targeted"]
    requires_scope: true
    timeout: 60
    max_args: 4
    max_arg_length: 260
    output_limit: 20000
  nmap_safe:
    description: "Run a constrained service-version scan against an allowed target. Do not repeat the built-in -sV flag; use args for optional flags such as -Pn or -p PORT."
    command: ["nmap", "-sV", "--top-ports", "100"]
    risk: medium
    permissions: ["process:spawn", "network:targeted"]
    requires_scope: true
    timeout: 120
    max_args: 6
    max_arg_length: 260
    output_limit: 20000
  ffuf_safe:
    description: "Run ffuf only against explicitly scoped CTF or local lab targets."
    command: ["ffuf"]
    risk: medium
    permissions: ["process:spawn", "network:targeted"]
    requires_scope: true
    timeout: 120
    max_args: 8
    max_arg_length: 500
    output_limit: 20000
